spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3307/aid_education_platform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456
  data:
    redis:
      host: 127.0.0.1
      port: 6379
  rabbitmq:
    host: 127.0.0.1
    port: 5672
    username: admin
    password: admin

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  secret: ${JWT_SECRET:change-me-in-env}

wx:
  miniapp:
    appid: ${WX_MINIAPP_APPID:wxbd4c9add97038750}
    secret: ${WX_MINIAPP_SECRET:default-secret}

aliyun:
  oss:
    endpoint: ${ALIYUN_OSS_ENDPOINT:oss-cn-beijing.aliyuncs.com}
    bucket-name: ${ALIYUN_OSS_BUCKET_NAME:zhixingtongyi}
    access-key-id: ${ALIYUN_OSS_ACCESS_KEY_ID:}
    access-key-secret: ${ALIYUN_OSS_ACCESS_KEY_SECRET:}
    sts:
      region-id: ${ALIYUN_STS_REGION_ID:cn-beijing}
      role-arn: ${ALIYUN_STS_ROLE_ARN:}
      role-session-name: ${ALIYUN_STS_ROLE_SESSION_NAME:ztysession}
      duration-seconds: ${ALIYUN_STS_DURATION_SECONDS:900}